# mkdocs.yml — site de documentacao tecnica do HomeFlix.
# nav gerado sobre docs/ (ADRs, standards, requisitos, roadmap).
# audits/ e TEMPLATE.md ficam fora do build (locais/nao-pagina).
site_name: HomeFlix — Documentação Técnica
site_url: https://lucaschf.github.io/homeflix/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  # Deep dark (slate) como padrao; toggle para o claro.
  # primary/accent = custom -> cores definidas em stylesheets/extra.css
  # (sem isso o Material aplica o indigo embutido e sobrescreve o :root).
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Modo claro }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Modo escuro }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      # Slugify unicode-preserving: mantem acentos nas ancoras (site pt-BR),
      # senao "Visão Geral" vira "visao-geral" e quebra TOCs manuais.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }

plugins:
  - search
  # Depende de historico git — so ativa no pipeline (CI=true).
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      fallback_to_build_date: true

# audits/ e o template de ADR nao entram no build (nem no --strict).
exclude_docs: |
  audits/
  adr/TEMPLATE.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Início: index.md
  - Funcionalidades: features.md
  - Requisitos: homeflix-requirements.md
  - Roadmap: roadmap.md
  - Standards:
      - standards/api-i18n-guide.md
      - standards/api-production-addons.md
      - standards/artwork-mirroring-guide.md
